# Typecheck + tests on every pull request and every push to main — the same
# two commands AGENTS.md names as the verification suite. The full suite is
# expected green: there are no tolerated failures, so any red here is a real
# regression (or a test left pinning copy that changed — update the pin in the
# same PR that changes the copy).
#
# The dependency audit also runs weekly so a new advisory surfaces without a
# pull request; the other jobs run then too, which is cheap and harmless.
#
# Actions are pinned by commit, the tag beside each: a moved tag cannot change
# what runs here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    # The Postgres race tests (src/lib/server/services/*-postgres.test.ts) run
    # here: on PGlite transactions never overlap, so only these show a cap or
    # a counter holding under concurrent requests. The image is the compose
    # file's, digest and all; under CI those files fail without the URL.
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_PASSWORD: race
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test
        env:
          GTNH_TEST_POSTGRES_URL: postgres://postgres:race@127.0.0.1:5432/postgres

  icon-browsers:
    name: Icon sizing in Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium firefox
      - run: npm run test:icons:browsers

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:gate
